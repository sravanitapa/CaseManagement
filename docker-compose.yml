version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: casemanagement-db
    environment:
      POSTGRES_DB: casesdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d casesdb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
  api:
    build: .
    image: casemanagement-api:latest
    container_name: casemanagement-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__casesdb: "Host=postgres;Database=casesdb;Username=postgres;Password=postgres"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:  

  
    
